<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Flashcards</title>
    <style>
@font-face {
            font-family: 'Pretendard';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Thin.woff2') format('woff2');
            font-weight: 100;
            font-display: swap;
        }

        @font-face {
            font-family: 'Pretendard';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-ExtraLight.woff2') format('woff2');
            font-weight: 200;
            font-display: swap;
        }

        @font-face {
            font-family: 'Pretendard';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Light.woff2') format('woff2');
            font-weight: 300;
            font-display: swap;
        }

        @font-face {
            font-family: 'Pretendard';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Regular.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }

        @font-face {
            font-family: 'Pretendard';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Medium.woff2') format('woff2');
            font-weight: 500;
            font-display: swap;
        }

        @font-face {
            font-family: 'Pretendard';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-SemiBold.woff2') format('woff2');
            font-weight: 600;
            font-display: swap;
        }

        @font-face {
            font-family: 'Pretendard';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Bold.woff2') format('woff2');
            font-weight: 700;
            font-display: swap;
        }

        @font-face {
            font-family: 'Pretendard';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-ExtraBold.woff2') format('woff2');
            font-weight: 800;
            font-display: swap;
        }

        @font-face {
            font-family: 'Pretendard';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Black.woff2') format('woff2');
            font-weight: 900;
            font-display: swap;
        }

        :root {
            --primary-color: #4a90e2;
            --danger-color: #e74c3c;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            font-family: 'Pretendard', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: inherit;
            font-size: 15px;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
            overflow-y: auto;
        }

        button,
        select,
        input,
        textarea,
        .nav-btn,
        .btn-main,
        header,
        .toggle-row,
        .dropdown-toggle,
        .dropdown-item,
        .card-face,
        .result-view,
        .toggle-row span {
            font-family: inherit;
        }

        header {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            padding: 15px 15px 20px;
            text-align: center;
            background: white;
            z-index: 10;
            display: flex; /* Flexbox 추가 */
            flex-direction: column; /* 세로 정렬 */
            gap: 10px; /* 요소 간 간격 */
            align-items: center; /* 추가: header의 자식들을 가운데 정렬 */
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            overflow: visible;
        }

        select {
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ddd;
            width: 90%;
            max-width: 400px;
            margin-left: auto; /* 기존 중앙 정렬 방해 요소 제거 */
            margin-right: auto; /* 기존 중앙 정렬 방해 요소 제거 */
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 90%;
            max-width: 400px;
        }

        /* Custom dropdown */
        .dropdown {
            position: relative;
            width: 100%;
            max-width: 100%;
            min-width: 0;
        }

        .dropdown-toggle {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #ddd;
            background: white;
            text-align: left;
            cursor: pointer;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            max-height: none;
            overflow: visible;
            background: white;
            border: 1px solid #eee;
            border-radius: 12px;
            z-index: 1000;
            padding: 8px;
            box-sizing: border-box;
        }

        .dropdown-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-color);
            white-space: normal;
            word-break: break-word;
        }

        .dropdown-item:hover,
        .dropdown-item.active {
            background: rgba(74,144,226,0.08);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.2s;
            border-radius: 999px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.2s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary-color);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* 화살표 내비게이션 바 */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            max-width: 500px;
            margin-top: 20px;
        }

        .nav-btn {
            background: #eef4fb;
            border: 1px solid #cbd9ed;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        #progress {
            font-weight: bold;
            color: var(--primary-color);
        }

        .result-view .btn-main {
            min-width: 220px;
            padding: 14px 26px;
            width: auto;
        }

        .stage {
            width: 100%;
            max-width: 420px;
            min-width: 280px;
            max-height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr auto; /* header / content / action */
            align-items: stretch;
            justify-items: center;
            padding: 0 12px 12px;
            row-gap: 24px;
            box-sizing: border-box;
            margin: 0 auto;
            background: transparent;
            overflow: visible;
        }

        @media (orientation: portrait) {
            .stage {
                width: 100vw;
                height: 100vh;
            }
        }

        @media (orientation: landscape) {
            .stage {
                width: min(calc(100vh * 9 / 16), 100vw);
                height: 100vh;
            }
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 0;
            overflow: visible;
            perspective: 1000px;
        }

        .card {
            width: 100%;
            max-width: 340px;
            aspect-ratio: 9 / 16;
            max-height: min(100%, calc(100vh - 260px));
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s;
            cursor: pointer;
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
            border-radius: 20px;
            text-align: center;
            font-size: 1.1rem;
            line-height: 1.55;
        }

        .card-front { background-color: var(--card-bg); border: 2px solid var(--primary-color); }
        .card-back { background-color: var(--primary-color); color: white; transform: rotateY(180deg); }

        .action-area {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            align-items: center;
        }

        .btn-main {
            border: none;
            padding: 14px 22px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            width: 80%;
            max-width: 300px;
        }

        .choice-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            margin-top: 12px;
        }

        .choice-group .btn-main {
            width: auto;
            min-width: 96px;
            padding: 12px 18px;
            border-radius: 999px;
        }

        #know-btn,
        #dont-know-btn {
            background-color: var(--primary-color);
            color: white;
        }
        #copy-btn { background-color: #2c3e50; color: white; }

        .result-view { display: none; flex-direction: column; align-items: center; text-align: center; }
    </style>
	<link rel="icon" href="./favicon.png" type="image/png" />
</head>
<body>

<div class="stage">

<header>
    <div class="dropdown" id="subject-dropdown">
        <button class="dropdown-toggle" id="subject-toggle">과목을 선택하세요</button>
        <div class="dropdown-menu" id="subject-menu"></div>
    </div>
    <div class="dropdown" id="set-dropdown">
        <button class="dropdown-toggle" id="set-toggle">문제 세트를 선택하세요</button>
        <div class="dropdown-menu" id="set-menu"></div>
    </div>
    <div class="toggle-row">
        <label class="switch">
            <input type="checkbox" id="random-toggle">
            <span class="slider"></span>
        </label>
        <span id="random-label">순서 랜덤</span>
    </div>
</header>

<div class="container">
    <div class="card" id="card">
        <div class="card-face card-front" id="question-text">세트를 선택해주세요.</div>
        <div class="card-face card-back" id="answer-text">정답</div>
    </div>

    <div id="result-display" class="result-view">
        <h2>학습 완료</h2>
        <button onclick="location.reload()" class="btn-main" style="margin-top: 15px;">다시 시작</button>
    </div>
</div>

<div class="action-area">
    <div class="nav-bar">
        <button class="nav-btn" id="dont-know-btn">모른다</button>
        <div id="progress">남은 0 / 총 0</div>
        <button class="nav-btn" id="know-btn">안다</button>
    </div>
    </div>

<script>
    let currentSet = null;
    let wrongIndices = new Set();
    let quizMap = {}; // quiz-map.json 데이터를 저장할 변수를 선언합니다.
    const setMenu = document.getElementById('set-menu');
    const setToggle = document.getElementById('set-toggle');
    const subjectMenu = document.getElementById('subject-menu');
    const subjectToggle = document.getElementById('subject-toggle');
    // 상태 저장
    let selectedSubjectKey = '';
    let selectedSetIndex = null;
    const card = document.getElementById('card');
    const qText = document.getElementById('question-text');
    const aText = document.getElementById('answer-text');
    const progress = document.getElementById('progress');
    const resultDisplay = document.getElementById('result-display');
    const knowBtn = document.getElementById('know-btn');
    const dontKnowBtn = document.getElementById('dont-know-btn');
    const randomToggle = document.getElementById('random-toggle');

    let isRandomOrder = false;
    let fullQuestionQueue = [];
    let activeQuestionQueue = [];

    // quiz-map.json을 로드하여 과목 목록을 생성하는 함수
    function loadSubjectList() {
        fetch('quiz-map.json')
            .then(res => {
                if (!res.ok) {
                    throw new Error(`HTTP error! status: ${res.status}`);
                }
                return res.json();
            })
            .then(data => {
                quizMap = data; // 전역 변수에 저장
                // subject menu 초기화
                subjectMenu.innerHTML = '';
                Object.keys(quizMap).forEach(key => {
                    const subjectInfo = quizMap[key];
                    const item = document.createElement('div');
                    item.className = 'dropdown-item';
                    item.dataset.key = key;
                    item.textContent = subjectInfo.title;
                    item.addEventListener('click', () => {
                        selectedSubjectKey = key;
                        subjectToggle.textContent = subjectInfo.title;
                        subjectMenu.style.display = 'none';
                        loadQuizData(key);
                    });
                    subjectMenu.appendChild(item);
                });
                // 이전 선택 자동 복원
                const lastSelectedSubject = localStorage.getItem('lastSelectedSubject');
                if (lastSelectedSubject && quizMap[lastSelectedSubject]) {
                    selectedSubjectKey = lastSelectedSubject;
                    subjectToggle.textContent = quizMap[lastSelectedSubject].title;
                    loadQuizData(lastSelectedSubject);
                } else {
                    resetUIForNoSelection();
                }
            })
            .catch(err => {
                console.error("quiz-map.json 로드 실패:", err);
                alert("과목 목록을 불러오는데 실패했습니다. 관리자에게 문의해주세요.");
            });
    }

    // 특정 과목의 퀴즈 데이터를 로드하는 함수
    function loadQuizData(subjectKey) {
        if (!subjectKey) {
            quizData = [];
            setMenu.innerHTML = '';
            setToggle.textContent = '문제 세트를 선택하세요';
            selectedSubjectKey = '';
            selectedSetIndex = null;
            currentSet = null;
            resetUIForNoSelection();
            localStorage.removeItem('lastSelectedSubject');
            return;
    }

        const subjectInfo = quizMap[subjectKey];
        if (!subjectInfo) {
            console.error(`과목 키 '${subjectKey}'에 대한 정보가 quiz-map.json에 없습니다.`);
            resetUIForNoSelection();
            alert("선택한 과목의 퀴즈 데이터를 찾을 수 없습니다.");
            localStorage.removeItem('lastSelectedSubject');
            return;
        }

        // 이전에 선택했던 과목 저장
        localStorage.setItem('lastSelectedSubject', subjectKey);

        // 이전에 선택했던 과목 저장
        localStorage.setItem('lastSelectedSubject', subjectKey);

        // 파일 경로에 한글이 포함될 경우를 대비해 encodeURIComponent 사용
        const encodedQuizFilePath = encodeURIComponent(subjectInfo.quiz_file).replace(/%2F/g, '/');

        fetch(encodedQuizFilePath)
            .then(res => {
                if (!res.ok) {
                    throw new Error(`파일 로드 실패: ${encodedQuizFilePath}, 상태: ${res.status}`);
                }
                return res.json();
            })
            .then(data => {
                quizData = data;
                // set menu 초기화 및 항목 생성
                setMenu.innerHTML = '';
                setMenu.style.display = 'none';
                data.forEach((item, index) => {
                    const it = document.createElement('div');
                    it.className = 'dropdown-item';
                    it.dataset.index = index;
                    it.textContent = item.title;
                    it.addEventListener('click', () => {
                        selectedSetIndex = index;
                        setToggle.textContent = item.title;
                        setMenu.style.display = 'none';
                        // 선택된 세트 로드
                        currentSet = quizData[index];
                        wrongIndices.clear();
                        initializeLearningSession();
                        // 저장
                        localStorage.setItem(`lastSelectedSet_${subjectKey}`, index);
                    });
                    setMenu.appendChild(it);
                });
                // 새 과목 선택 시 UI 초기화
                currentSet = null;
                wrongIndices.clear();
                resetDisplay(); // 카드와 버튼들 초기화
                // initial card state
                qText.textContent = "세트를 선택해주세요.";
                aText.textContent = "정답";
                progress.textContent = "남은 0 / 총 0";
                card.classList.remove('is-flipped');

                // 과목 로드 후 이전에 선택했던 세트가 있다면 자동으로 선택하고 학습을 시작
                const lastSelectedSet = localStorage.getItem(`lastSelectedSet_${subjectKey}`);
                if (lastSelectedSet && data[lastSelectedSet]) {
                    selectedSetIndex = Number(lastSelectedSet);
                    setToggle.textContent = data[selectedSetIndex].title;
                    currentSet = data[selectedSetIndex];
                    wrongIndices.clear();
                    initializeLearningSession();
                }
            }).catch(err => {
                console.error("퀴즈 JSON 로드 실패:", err);
                quizData = [];
                setMenu.innerHTML = '';
                setToggle.textContent = '문제 세트를 선택하세요';
                currentSet = null;
                resetUIForNoSelection();
                alert(`'${subjectInfo.title}' 퀴즈 데이터를 불러오는데 실패했습니다.`);
                localStorage.removeItem(`lastSelectedSet_${subjectKey}`);
            });
    }

    // 과목 선택이 해제되거나 데이터 로드 실패 시 UI를 초기 상태로 되돌리는 함수
    function resetUIForNoSelection() {
        card.style.display = 'block';
        resultDisplay.style.display = 'none';
        qText.textContent = "세트를 선택해주세요.";
        aText.textContent = "정답";
        progress.textContent = "남은 0 / 총 0";
        card.classList.remove('is-flipped');
        // 드롭다운 기본 상태로 복원
        if (typeof subjectToggle !== 'undefined') subjectToggle.textContent = '과목을 선택하세요';
        if (typeof setToggle !== 'undefined') setToggle.textContent = '문제 세트를 선택하세요';
    }

    function createQuestionOrder(length) {
        const order = Array.from({ length }, (_, index) => index);
        if (isRandomOrder) {
            for (let i = order.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [order[i], order[j]] = [order[j], order[i]];
            }
        }
        return order;
    }

    function initializeLearningSession() {
        fullQuestionQueue = createQuestionOrder(currentSet.quiz.length);
        activeQuestionQueue = fullQuestionQueue.splice(0, 5);
        resetDisplay();
        showQuestion();
    }

    function updateOrderState() {
        if (!currentSet) return;
        wrongIndices.clear();
        initializeLearningSession();
    }

    // 페이지 로드 시 과목 목록 로드
    document.addEventListener('DOMContentLoaded', () => {
        isRandomOrder = localStorage.getItem('isRandomOrder') === 'true';
        randomToggle.checked = isRandomOrder;
        loadSubjectList();
    });

    randomToggle.addEventListener('change', (e) => {
        isRandomOrder = e.target.checked;
        localStorage.setItem('isRandomOrder', isRandomOrder);
        if (currentSet) {
            updateOrderState();
        }
    });

    knowBtn.addEventListener('click', () => handleAnswer(true));
    dontKnowBtn.addEventListener('click', () => handleAnswer(false));

    function handleAnswer(isKnown) {
        if (!currentSet || activeQuestionQueue.length === 0) return;
        const currentIdx = activeQuestionQueue.shift();

        if (!isKnown) {
            wrongIndices.add(currentIdx);
            activeQuestionQueue.push(currentIdx);
        } else if (fullQuestionQueue.length > 0) {
            activeQuestionQueue.push(fullQuestionQueue.shift());
        }

        if (activeQuestionQueue.length === 0) {
            showResult();
            return;
        }

        showQuestion();
    }
    // 드롭다운 토글 동작
    subjectToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        const shown = subjectMenu.style.display === 'block';
        subjectMenu.style.display = shown ? 'none' : 'block';
        setMenu.style.display = 'none';
    });

    setToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        const shown = setMenu.style.display === 'block';
        setMenu.style.display = shown ? 'none' : 'block';
        subjectMenu.style.display = 'none';
    });

    // 밖 클릭 시 드롭다운 닫기
    document.addEventListener('click', () => {
        subjectMenu.style.display = 'none';
        setMenu.style.display = 'none';
    });

    function resetDisplay() {
        card.style.display = 'block';
        resultDisplay.style.display = 'none';
    }

    card.addEventListener('click', () => card.classList.toggle('is-flipped'));

    function showQuestion() {
        if (!currentSet || currentSet.quiz.length === 0) {
            resetUIForNoSelection();
            return;
        }

        if (activeQuestionQueue.length === 0) {
            showResult();
            return;
        }
        
        // transition 비활성화하여 즉시 카드 상태 변경
        card.style.transition = '0s';
        card.classList.remove('is-flipped');
        // 레이아웃 재계산 강제 (reflow)
        void card.offsetHeight;
        
        const currentQuizIndex = activeQuestionQueue[0];
        const rawQuestion = currentSet.quiz[currentQuizIndex];
        const rawAnswer = currentSet.answer[currentQuizIndex];
        
        // "n. " 형식의 번호 제거
        const removeNumberPrefix = (text) => text.replace(/^\d+\.\s*/, '');
        
        qText.textContent = removeNumberPrefix(rawQuestion);
        aText.textContent = removeNumberPrefix(rawAnswer);
        
        // transition 복원
        card.style.transition = 'transform 0.5s';
        
        // 상태 업데이트
        const remaining = activeQuestionQueue.length + fullQuestionQueue.length;
        progress.textContent = `남은 ${remaining} / 총 ${currentSet.quiz.length}`;
    }

    function nextQuestion() {
        return;
    }

    function prevQuestion() {
        return;
    }

    function showResult() {
        card.style.display = 'none';
        resultDisplay.style.display = 'flex';
    }

    // 키보드 지원
    document.addEventListener('keydown', (e) => {
        if (e.key === "ArrowRight") handleAnswer(true);
        if (e.key === "ArrowLeft") handleAnswer(false);
        if (e.key === " ") { e.preventDefault(); card.classList.toggle('is-flipped'); }
    });
</script>

</body>
</html>
